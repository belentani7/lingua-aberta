name: Deploy Netlify (verified manual release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingua-aberta-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require main and configured credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must run from main."
            exit 1
          fi
          for key in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing ${key}. Deployment was not attempted."
              exit 1
            fi
          done

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate student flows and types
        run: |
          set -euo pipefail
          node --test tests/student-site.test.mjs tests/miara-learning.test.mjs tests/privacy-fixtures.test.mjs
          node --test tests/campus-product.test.mjs tests/pt-es-course-content.test.mjs tests/catalan-eso-curriculum.test.mjs tests/full-campus-integration.test.mjs
          pnpm run check
      - name: Build actual release artifact
        run: |
          set -euo pipefail
          pnpm run build
          test -s dist/public/index.html
          test -s dist/public/campus/index.html
          test -s dist/public/campus/pratica-rapida.html
          test -s dist/public/campus/course-data.mjs

      - name: Deploy to existing Netlify site
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist/public
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Lingua Aberta verified manual release"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
