name: Puente PT-ES course content
on:
  pull_request:
    paths:
      - "campus/cursos/falsos-amigos-pt-es/**"
      - "campus/index.html"
      - "tests/pt-es-course-content.test.mjs"
      - ".github/workflows/pt-es-course.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run dependency-free learning content acceptance checks
        run: node --test tests/pt-es-course-content.test.mjs
