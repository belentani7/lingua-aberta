name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy - set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: pnpm build
      - uses: cloudflare/pages-action@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: lingua-aberta
          directory: ./dist/public
          branch: main
