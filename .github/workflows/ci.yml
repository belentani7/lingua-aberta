name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    name: Build, Typecheck, Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm check
