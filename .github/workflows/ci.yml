name: Lingua Aberta / student product and campus gates
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact project lockfile
        run: pnpm install --frozen-lockfile
      - name: Student entrypoint, content, privacy, and full campus acceptance
        run: |
          node --test tests/student-site.test.mjs tests/miara-learning.test.mjs tests/privacy-fixtures.test.mjs
          node --test tests/campus-product.test.mjs tests/pt-es-course-content.test.mjs tests/catalan-eso-curriculum.test.mjs tests/full-campus-integration.test.mjs
      - name: TypeScript source validation
        run: pnpm run check
      - name: Production build
        run: pnpm run build
      - name: Verify real frontend artifact
        run: test -s dist/public/index.html
