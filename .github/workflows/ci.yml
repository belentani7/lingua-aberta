name: Lingua Aberta / full learning contract
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Education, content, privacy and production gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reproducible dependency install
        run: pnpm install --frozen-lockfile
      - name: JavaScript syntax and static course pack contract
        run: |
          node --check campus/app.js
          node --check campus/course-data.mjs
          node --check campus/sw.js
          node --test tests/privacy-fixtures.test.mjs tests/miara-learning.test.mjs tests/campus-product.test.mjs
      - name: TypeScript checks
        run: pnpm run check
      - name: Production frontend
        run: pnpm run build
